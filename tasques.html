<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Extractor de Tasques a Excel i PDF — Ajuntament de Marratxí</title>
  <style>
    :root {
      --primary: #80146e;
      --primary-dark: #630f55;
      --secondary: #003366;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TOPBAR */
    .topbar {
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid var(--primary);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      height: 42px;
      max-width: 160px;
      object-fit: contain;
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
    }

    .brand-text p {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
    }

    .btn-nav {
      background: var(--secondary);
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-nav:hover { background: #002244; }

    /* CONTENIDOR */
    .box {
      max-width: 800px;
      width: calc(100% - 24px);
      margin: 16px auto;
      background: #fff;
      padding: 22px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    @media (max-width: 600px) {
      .box { padding: 16px; }
      .brand-logo { height: 36px; }
      .brand-text h1 { font-size: 13px; }
    }

    h2 { color: var(--primary); font-size: 18px; margin-bottom: 4px; }
    p.sub { color: var(--muted); margin-bottom: 18px; font-size: 13px; font-weight: 600; }

    .card-settings {
      background: #fafafa;
      border: 1px solid #e2e8f0;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .camp { margin-bottom: 12px; }
    .camp:last-child { margin-bottom: 0; }

    label {
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
      color: #475569;
      display: block;
      margin-bottom: 5px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      font-size: 13px;
      margin-bottom: 4px;
    }

    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--primary-dark); }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-green { background: #15803d; }
    .btn-green:hover { background: #166534; }
    .btn-blue { background: #0284c7; }
    .btn-blue:hover { background: #0369a1; }
    .btn-tasks { background: #4285f4; }
    .btn-tasks:hover { background: #3367d6; }
    .btn-sm {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #log {
      margin-top: 14px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block !important; }
    .err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block !important; }

    .task-row {
      padding: 8px 6px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* FORMAT D'IMPRESSIÓ PER A FULL A4 */
    @media print {
      body { background: #fff; padding: 0; }
      .no-print, .topbar { display: none !important; }
      #printableArea { display: block !important; }
      .box { border: none; box-shadow: none; padding: 0; width: 100%; margin: 0; }
      .print-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--primary);
        padding-bottom: 10px;
        margin-bottom: 18px;
      }
      .print-header img { max-height: 52px; }
      .print-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      .print-table th, .print-table td {
        border: 1px solid #cbd5e1;
        padding: 6px 8px;
        text-align: left;
      }
      .print-table th { background: #f8fafc; color: var(--primary); font-weight: bold; }
      .print-footer {
        margin-top: 35px;
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        page-break-inside: avoid;
      }
      .signature-box {
        border-top: 1px dashed #777;
        width: 200px;
        text-align: center;
        padding-top: 5px;
      }
    }
  </style>
</head>
<body>

<!-- BARRA SUPERIOR RESPONSIVA -->
<header class="topbar no-print">
  <div class="brand">
    <img src="logo.png" alt="Ajuntament de Marratxí" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-text">
      <h1>Manteniment i Climatització</h1>
      <p>Ajuntament de Marratxí</p>
    </div>
  </div>
  <a href="index.html" class="btn-nav">← Generador d'Informes</a>
</header>

<div class="box no-print">
  <h2>📋 Extractor de Tasques a Excel, PDF i Tasks</h2>
  <p class="sub">Processament Intel·ligent de Parts d'Avaries i Manteniment</p>

  <div class="card-settings">
    <!-- CLAU GEMINI PERSISTENT -->
    <div class="camp">
      <label for="clauApiInput">Clau d'API de Google Gemini:</label>
      <div style="display: flex; gap: 8px;">
        <input type="password" id="clauApiInput" placeholder="Introdueix la teva clau AI Studio..." onchange="guardarClauLocal()">
        <button type="button" class="btn-sm" onclick="mostrarOcultarClau()">👁️</button>
      </div>
      <span id="clauAvis" style="font-size: 11px; color: #64748b;">Es guarda en privat al navegador i no s'exposa mai a GitHub.</span>
    </div>

    <!-- DOCUMENT A PROCESSAR -->
    <div class="camp">
      <label for="arxiu">Document a processar (PDF o Imatge):</label>
      <input type="file" id="arxiu" accept=".pdf, .png, .jpg, .jpeg">
    </div>

    <div style="margin-top: 14px;">
      <button id="boto" class="btn" onclick="iniciarProcessament()">🔄 Processar Document</button>
    </div>
  </div>

  <div id="log"></div>

  <!-- RESULTATS DETECTATS -->
  <div id="blocResultats" style="display:none; margin-top: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;">
      <h3 id="titolTasques" style="margin: 0; font-size: 15px; font-weight: 800; color: #0f172a;">Tasques detectades</h3>
      <div style="display: flex; gap: 6px;">
        <button class="btn-sm" onclick="marcarTots(true)">Marcar tots</button>
        <button class="btn-sm" onclick="marcarTots(false)">Desmarcar tots</button>
      </div>
    </div>

    <div id="llistaTasques" style="max-height: 250px; overflow-y: auto; border: 1px solid #cbd5e1; padding: 8px; border-radius: 6px; margin-bottom: 16px; background: #fff;"></div>

    <!-- SINCRONITZACIÓ GOOGLE TASKS -->
    <div class="card-settings" style="border-left: 4px solid #4285f4;">
      <label style="color: #1a73e8; font-size: 13px;">📂 Sincronitzar amb Google Tasks</label>
      
      <div style="margin-bottom: 10px; font-size: 13px;">
        <label style="display: inline; font-weight: normal;"><input type="radio" name="modeTasks" value="existent" checked onchange="canviarModeTasks()"> Afegir a llista existent</label>
        <label style="display: inline; font-weight: normal; margin-left: 15px;"><input type="radio" name="modeTasks" value="nova" onchange="canviarModeTasks()"> Crear llista nova</label>
      </div>

      <div id="blocLlistaExistent" class="camp">
        <label for="selectTasksList">Llista de destinació:</label>
        <div style="display: flex; gap: 8px;">
          <select id="selectTasksList"><option value="">Carregant llistes...</option></select>
          <button class="btn-sm" onclick="carregarLlistesTasks()">🔄</button>
        </div>
      </div>

      <div id="blocLlistaNova" class="camp" style="display: none;">
        <label for="nomNovaLlista">Nom de la nova llista:</label>
        <input type="text" id="nomNovaLlista" placeholder="Ex: Manteniment CEIP Ses Cases Noves">
      </div>

      <button id="btnEnviarTasks" class="btn btn-tasks" onclick="enviarAGoogleTasks()">🚀 Enviar a Google Tasks</button>
    </div>

    <!-- FORMATS D'EXPORTACIÓ -->
    <div class="card-settings">
      <label for="formatSelect">Format de document:</label>
      <select id="formatSelect" onchange="canviarFormatUI()" style="margin-bottom: 12px;">
        <option value="1">1. Oficial Marratxí (Capçalera, Àrea i Signatura)</option>
        <option value="2">2. Registre de Manteniment i Incidències</option>
        <option value="3">3. Comanda / Inventari de Materials</option>
        <option value="4">4. Llista de Control Simple (Checklist)</option>
      </select>

      <div class="grid-2">
        <div>
          <label for="orgInput">Organisme:</label>
          <input type="text" id="orgInput" value="AJUNTAMENT DE MARRATXÍ">
        </div>
        <div>
          <!-- LLISTAT OFICIAL D'ÀREES DE MARRATXÍ -->
          <label for="areaInput">Àrea Destinatària:</label>
          <select id="areaInput">
            <option value="Economia i Educació">Economia i Educació</option>
            <option value="Neteja Viària, Parcs i Jardins">Neteja Viària, Parcs i Jardins</option>
            <option value="Contractació i Esports">Contractació i Esports</option>
            <option value="Alcaldia, Comunicació i Urbanisme">Alcaldia, Comunicació i Urbanisme</option>
            <option value="Serveis Funeraris i Seguretat Ciudadana">Serveis Funeraris i Seguretat Ciudadana</option>
            <option value="Promoció Econòmica, Comerç, Indústria i Turisme; Interior i Recursos Humans">Promoció Econòmica, Comerç, Indústria i Turisme; Interior i Recursos Humans</option>
            <option value="Medi Ambient i Agricultura">Medi Ambient i Agricultura</option>
            <option value="Serveis Socials, Igualtat, Salut i Consum">Serveis Socials, Igualtat, Salut i Consum</option>
            <option value="Formació, Ocupació i Joventut">Formació, Ocupació i Joventut</option>
            <option value="Mobilitat, Transport Públic, Vies i Obres">Mobilitat, Transport Públic, Vies i Obres</option>
            <option value="Cultura, Ceràmica, Patrimoni Històric i Municipal">Cultura, Ceràmica, Patrimoni Històric i Municipal</option>
            <option value="Participació Ciutadana, Defensora de la Ciutadania i Transparència">Participació Ciutadana, Defensora de la Ciutadania i Transparència</option>
            <option value="Gent Gran, Fires i Festes">Gent Gran, Fires i Festes</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label for="titolDocInput">Títol del document:</label>
          <input type="text" id="titolDocInput" value="Ordre de Treball / Manteniment">
        </div>
        <div>
          <label for="operariInput">Operari / Tècnic responsable:</label>
          <input type="text" id="operariInput" placeholder="Nom de l'operari...">
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
        <button class="btn btn-green" onclick="descarregarExcelPersonalitzat()">⬇️ Descarregar Excel (.CSV)</button>
        <button class="btn btn-blue" onclick="imprimirPDF()">🖨️ Imprimir / Guardar com a PDF</button>
      </div>
    </div>
  </div>
</div>

<div id="printableArea" style="display: none;"></div>

<script>
  let tasquesExtretes = [];
  let nomFitxerNet = "Tasques";

  window.addEventListener("DOMContentLoaded", () => {
    const clauGuardada = localStorage.getItem("clau_gemini_marratxi");
    if (clauGuardada) {
      document.getElementById("clauApiInput").value = clauGuardada;
      document.getElementById("clauAvis").textContent = "✓ Clau d'API activa i guardada de forma segura.";
      document.getElementById("clauAvis").style.color = "#16a34a";
    }

    carregarLlistesTasks();
  });

  function guardarClauLocal() {
    const clau = document.getElementById("clauApiInput").value.trim();
    if (clau) {
      localStorage.setItem("clau_gemini_marratxi", clau);
      document.getElementById("clauAvis").textContent = "✓ Clau desada al navegador amb èxit.";
      document.getElementById("clauAvis").style.color = "#16a34a";
    } else {
      localStorage.removeItem("clau_gemini_marratxi");
      document.getElementById("clauAvis").textContent = "Introdueix una clau vàlida per processar documents.";
      document.getElementById("clauAvis").style.color = "#dc2626";
    }
  }

  function mostrarOcultarClau() {
    const input = document.getElementById("clauApiInput");
    input.type = input.type === "password" ? "text" : "password";
  }

  function avisar(text, esError = false) {
    const el = document.getElementById("log");
    el.textContent = text;
    el.className = esError ? "err" : "info";
  }

  function marcarTots(estat) {
    document.querySelectorAll('#llistaTasques input[type="checkbox"]').forEach(c => c.checked = estat);
  }

  function canviarFormatUI() {
    const fmt = document.getElementById("formatSelect").value;
    const titolInput = document.getElementById("titolDocInput");
    if (fmt === "1") titolInput.value = "Ordre de Treball / Manteniment";
    else if (fmt === "2") titolInput.value = "Registre d'Incidències i Avaries";
    else if (fmt === "3") titolInput.value = "Comanda de Materials / Inventari";
    else titolInput.value = "Llista de Control Simple";
  }

  function canviarModeTasks() {
    const mode = document.querySelector('input[name="modeTasks"]:checked').value;
    document.getElementById("blocLlistaExistent").style.display = (mode === "existent") ? "block" : "none";
    document.getElementById("blocLlistaNova").style.display = (mode === "nova") ? "block" : "none";
  }

  function carregarLlistesTasks() {
    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((llistes) => {
          const select = document.getElementById("selectTasksList");
          select.innerHTML = "";
          if (!llistes || llistes.length === 0) {
            select.innerHTML = "<option value=''>No s'han trobat llistes</option>";
            return;
          }
          llistes.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = l.title;
            select.appendChild(opt);
          });
        })
        .withFailureHandler((err) => {
          console.error(err);
        })
        .getGoogleTaskLists();
    }
  }

  function enviarAGoogleTasks() {
    const seleccionades = getTasquesSeleccionades();
    if (seleccionades.length === 0) {
      alert("Selecciona almenys una tasca per sincronitzar.");
      return;
    }

    const btn = document.getElementById("btnEnviarTasks");
    const mode = document.querySelector('input[name="modeTasks"]:checked').value;
    const targetId = document.getElementById("selectTasksList").value;
    const novaLlista = document.getElementById("nomNovaLlista").value;

    if (mode === "nova" && !novaLlista.trim()) {
      alert("Si us plau, escriu un nom per a la nova llista.");
      return;
    }

    btn.disabled = true;
    btn.textContent = "⏳ Sincronitzant amb Google Tasks...";

    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          btn.disabled = false;
          btn.textContent = "🚀 Enviar a Google Tasks";
          alert("✅ S'han afegit " + res.count + " tasques a Google Tasks correctament!");
          if (mode === "nova") carregarLlistesTasks();
        })
        .withFailureHandler((err) => {
          btn.disabled = false;
          btn.textContent = "🚀 Enviar a Google Tasks";
          alert("Error en sincronitzar: " + err.message);
        })
        .syncTasksToGoogleTasks(seleccionades, (mode === "existent" ? targetId : null), (mode === "nova" ? novaLlista : null));
    } else {
      alert("La sincronització amb Google Tasks requereix executar-se des d'un complement Google Apps Script.");
      btn.disabled = false;
      btn.textContent = "🚀 Enviar a Google Tasks";
    }
  }

  async function iniciarProcessament() {
    const clauApi = document.getElementById("clauApiInput").value.trim() || localStorage.getItem("clau_gemini_marratxi");
    
    if (!clauApi) {
      alert("Si us plau, introdueix la teva clau d'API de Google Gemini a la casella superior.");
      document.getElementById("clauApiInput").focus();
      return;
    }

    const selector = document.getElementById("arxiu");
    const fitxer = selector.files[0];
    const boto = document.getElementById("boto");

    if (!fitxer) {
      alert("Si us plau, selecciona primer el fitxer PDF o imatge.");
      return;
    }

    nomFitxerNet = fitxer.name.replace(/\.[^/.]+$/, "");
    document.getElementById("nomNovaLlista").value = nomFitxerNet;
    boto.disabled = true;
    avisar("1/2 Llegint fitxer local...");

    try {
      const base64Data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(fitxer);
      });

      let tipusMime = fitxer.type;
      if (!tipusMime) {
        if (fitxer.name.toLowerCase().endsWith(".pdf")) tipusMime = "application/pdf";
        else tipusMime = "image/jpeg";
      }

      avisar("2/2 Connectant amb Gemini per analitzar les incidències...");

      const prompt = 
        "Analitza aquest document o taula de manteniment/incidències. " +
        "Llegeix totes les aules, estances o apartats (per exemple Aula 1, Aula 6, Banys, Pati, Sala Polivalent, etc.) " +
        "i extreu cadascuna de les tasques, reparacions o materials anotats. " +
        "Si hi ha múltiples incidències en una mateixa fila/aula, separa-les en línies independents. " +
        "Escriu cada element en el format: '[Ubicació/Aula] Descripció de la tasca'. " +
        "Corregeix errors evidents de transcripció i conserva el català o castellà original. " +
        "Retorna ÚNICAMENT la llista neta, un element per línia, sense guions ni text introductori.";

      const cosPeticio = {
        contents: [{
          parts: [
            { text: prompt },
            {
              inlineData: {
                mimeType: tipusMime,
                data: base64Data
              }
            }
          ]
        }]
      };

      // Bucle seqüencial amb alternatives per evitar saturació de models
      const modelsAProvar = [
        "gemini-2.5-flash",
        "gemini-3.8-flash",
        "gemini-2.5-pro",
        "gemini-flash-latest"
      ];

      let dades = null;
      let darrerError = null;

      for (const m of modelsAProvar) {
        try {
          const url = "https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + clauApi;
          const resposta = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(cosPeticio)
          });
          const jsonResp = await resposta.json();
          if (!jsonResp.error) {
            dades = jsonResp;
            break;
          } else {
            darrerError = jsonResp.error.message || JSON.stringify(jsonResp.error);
          }
        } catch (e) {
          darrerError = e.message;
        }
      }

      if (!dades) {
        throw new Error(darrerError || "No s'ha pogut obtenir resposta de l'API de Gemini.");
      }

      const textRetornat = dades.candidates?.[0]?.content?.parts?.[0]?.text || "";

      tasquesExtretes = textRetornat
        .split("\n")
        .map(linia => linia.trim().replace(/^[-*•0-9.\s]+/, ""))
        .filter(linia => linia.length > 0);

      if (tasquesExtretes.length === 0) {
        avisar("No s'ha trobat cap incidència o tasca al document.", true);
      } else {
        dibuixarTasques();
        document.getElementById("log").style.display = "none";
      }

    } catch (err) {
      console.error(err);
      avisar("Error detallat: " + err.message, true);
    } finally {
      boto.disabled = false;
    }
  }

  function dibuixarTasques() {
    const contenidor = document.getElementById("llistaTasques");
    contenidor.innerHTML = "";
    document.getElementById("titolTasques").textContent = "Tasques trobades (" + tasquesExtretes.length + ")";

    tasquesExtretes.forEach((t, i) => {
      const fila = document.createElement("div");
      fila.className = "task-row";
      fila.innerHTML = 
        '<input type="checkbox" id="chk_' + i + '" checked>' +
        '<label for="chk_' + i + '" style="margin-bottom:0; font-weight:normal; cursor:pointer;">' + t + '</label>';
      contenidor.appendChild(fila);
    });

    document.getElementById("blocResultats").style.display = "block";
  }

  function getTasquesSeleccionades() {
    const sel = [];
    tasquesExtretes.forEach((t, i) => {
      const chk = document.getElementById("chk_" + i);
      if (chk && chk.checked) sel.push(t);
    });
    return sel;
  }

  function separarUbicacio(item) {
    let lloc = "";
    let desc = item;
    if (item.startsWith("[") && item.includes("]")) {
      const p = item.split("]");
      lloc = p[0].replace("[", "").trim();
      desc = p[1].trim();
    } else if (item.includes(" | ")) {
      const p = item.split(" | ");
      lloc = p[0].trim();
      desc = p[1].trim();
    }
    return { lloc: lloc.replace(/"/g, '""'), desc: desc.replace(/"/g, '""') };
  }

  function descarregarExcelPersonalitzat() {
    const tasques = getTasquesSeleccionades();
    if (tasques.length === 0) {
      alert("Selecciona almenys una tasca.");
      return;
    }

    const fmt = document.getElementById("formatSelect").value;
    const org = document.getElementById("orgInput").value;
    const area = document.getElementById("areaInput").value;
    const titol = document.getElementById("titolDocInput").value;
    const operari = document.getElementById("operariInput").value;
    const avui = new Date().toLocaleDateString('ca-ES');

    let csv = "\uFEFF";

    if (fmt === "1") {
      csv += org + ";;;;\n";
      csv += area + ";;;;\n";
      csv += titol + " | Data: " + avui + ";;;;\n\n";
      csv += "Nº;Revisat;Ubicació / Aula;Descripció de la Tasca;Estat;Signatura / Operari\n";
      tasques.forEach((item, idx) => {
        let { lloc, desc } = separarUbicacio(item);
        csv += (idx + 1) + ';[   ];"' + lloc + '";"' + desc + '";Pendent;"' + operari + '"\n';
      });
    } else if (fmt === "2") {
      csv += "Nº;Data;Edifici / Centre;Descripció d'Avaria o Actuació;Acció Realitzada;Operari\n";
      tasques.forEach((item, idx) => {
        let { lloc, desc } = separarUbicacio(item);
        csv += (idx + 1) + ';' + avui + ';"' + lloc + '";"' + desc + '";"";"' + operari + '"\n';
      });
    } else if (fmt === "3") {
      csv += "Ítem;Quantitat;Unitat;Descripció del Material / Tasca;Ubicació / Destí;Revisat\n";
      tasques.forEach((item, idx) => {
        let { lloc, desc } = separarUbicacio(item);
        csv += (idx + 1) + ';"";"Uts / Caixes";"' + desc + '";"' + lloc + '";[   ]\n';
      });
    } else {
      csv += "Nº;Control;Descripció / Tasca;Estat;Observacions\n";
      tasques.forEach((item, idx) => {
        csv += (idx + 1) + ';[   ];"' + item.replace(/"/g, '""') + '";Pendent;""\n';
      });
    }

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Marratxi_" + nomFitxerNet + ".csv";
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function imprimirPDF() {
    const tasques = getTasquesSeleccionades();
    if (tasques.length === 0) {
      alert("Selecciona almenys una tasca.");
      return;
    }

    const org = document.getElementById("orgInput").value;
    const area = document.getElementById("areaInput").value;
    const titol = document.getElementById("titolDocInput").value;
    const operari = document.getElementById("operariInput").value || "Tècnic responsable";
    const avui = new Date().toLocaleDateString('ca-ES');

    const printContainer = document.getElementById("printableArea");

    let tableRows = "";
    tasques.forEach((item, idx) => {
      let { lloc, desc } = separarUbicacio(item);
      tableRows += 
        '<tr>' +
          '<td style="text-align:center; width: 35px;">' + (idx + 1) + '</td>' +
          '<td style="text-align:center; width: 45px;">[ &nbsp; ]</td>' +
          '<td style="width: 140px; font-weight: bold;">' + (lloc || "General") + '</td>' +
          '<td>' + desc + '</td>' +
          '<td style="width: 80px; text-align: center;">Pendent</td>' +
        '</tr>';
    });

    printContainer.innerHTML = 
      '<div class="print-header">' +
        '<div><img src="logo.png" alt="Ajuntament de Marratxí" onerror="this.style.display=\'none\'"></div>' +
        '<div style="text-align: right;">' +
          '<div style="font-size: 14px; font-weight: bold; color: #80146e;">' + org + '</div>' +
          '<div style="font-size: 13px; font-weight: bold; color: #1e293b;">' + area + '</div>' +
          '<div style="font-size: 11px; color: #64748b;">' + titol + ' | Data: ' + avui + '</div>' +
        '</div>' +
      '</div>' +

      '<table class="print-table">' +
        '<thead>' +
          '<tr>' +
            '<th>Nº</th>' +
            '<th>Rev.</th>' +
            '<th>Ubicació / Estança</th>' +
            '<th>Descripció de la Tasca / Incidència</th>' +
            '<th>Estat</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' +
          tableRows +
        '</tbody>' +
      '</table>' +

      '<div class="print-footer">' +
        '<div><strong>Operari / Tècnic:</strong> ' + operari + '</div>' +
        '<div class="signature-box">Conforme / Signatura i Segell</div>' +
      '</div>';

    window.print();
  }
</script>
